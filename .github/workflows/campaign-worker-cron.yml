name: WhatsApp Campaign Queue & Auto-Resume Worker

on:
  schedule:
    # Runs every 15 minutes 24/7/365 to auto-resume daily-limit paused broadcasts and drain queues
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping-campaign-worker:
    name: Ping Campaign Worker
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger Serverless Campaign Queue Worker
        run: |
          echo "Pinging WhatsApp campaign queue worker at $(date)..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X GET \
            "https://local-business-os-amber.vercel.app/api/whatsapp/campaigns/worker" \
            -H "x-ui-bypass: true" \
            --max-time 60)
          echo "Worker response status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 204 ]; then
            echo "Successfully pinged campaign worker."
          else
            echo "Worker ping returned HTTP $HTTP_STATUS (non-fatal)"
          fi
